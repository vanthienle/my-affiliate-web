<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Săn Voucher & Chuyển Link Mua Hàng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 min-h-screen flex flex-col items-center p-4">

    <!-- Container Chính -->
    <div class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden my-4 border border-slate-200">
        
        <!-- Header Banner & Avatar -->
        <div class="bg-gradient-to-r from-orange-500 to-rose-500 p-6 text-center text-white relative">
            <div class="w-24 h-24 mx-auto rounded-full border-4 border-white overflow-hidden shadow-md mb-3">
                <img src="https://i.postimg.cc/zfvsVWKV/Screenshot-2026-09-06-at-23-56-50.png">
            </div>
            <h1 class="text-xl font-bold">BOT Shopping 🛒</h1>
            <p class="text-xs text-orange-100 mt-1">Lấy link giảm giá & Hoàn tiền Shopee / TikTok</p>
        </div>

        <!-- Khung Chuyển Đổi Link -->
        <div class="p-5">
            <label class="block text-sm font-semibold text-gray-700 mb-2">Dán link Shopee / TikTok vào đây:</label>
            <div class="space-y-3">
                <input type="text" id="inputUrl" placeholder="https://shopee.vn/product/..." 
                       class="w-full px-4 py-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-500 focus:outline-none text-sm">
                
                <button onclick="processLink()" id="btnSubmit" 
                        class="w-full bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl transition-all shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-bolt"></i> CHUYỂN LINK GIẢM GIÁ
                </button>
            </div>

            <!-- Kết Quả Chuyển Đổi -->
            <div id="resultBox" class="hidden mt-5 p-4 bg-orange-50 rounded-2xl border border-orange-200">
                <p id="resTitle" class="font-semibold text-sm text-gray-800 line-clamp-2 mb-1"></p>
                <p id="resPrice" class="text-red-600 font-bold text-base mb-3"></p>
                
                <a id="resBtn" href="#" target="_blank" 
                   class="block w-full text-center bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-sm shadow">
                    👉 Mua Ngay Trên App
                </a>
            </div>
        </div>

        <!-- Nút Tham Gia Nhóm Zalo -->
        <div class="px-5 pb-6">
            <div class="border-t border-gray-200 pt-4">
                <a href="https://zalo.me/g/gzjkxxocyzaaacu81hp6" target="_blank" 
                   class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl flex items-center justify-center gap-2 text-sm shadow-md">
                    <i class="fa-solid fa-users"></i> Tham Gia Nhóm Zalo Săn Mã
                </a>
            </div>
        </div>

    </div>

    <!-- Script Xử Lý Client -->
    <script>
        async function processLink() {
            const input = document.getElementById('inputUrl');
            const btn = document.getElementById('btnSubmit');
            const resultBox = document.getElementById('resultBox');
            const url = input.value.trim();

            if (!url) return alert('Vui lòng dán đường dẫn sản phẩm!');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner animate-spin"></i> Đang xử lý...';

            try {
                const res = await fetch('/api/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: url })
                });
                const data = await res.json();

                if (data.success) {
                    document.getElementById('resTitle').innerText = data.data.title;
                    document.getElementById('resPrice').innerText = data.data.price > 0 ? `Giá khoảng: ${data.data.price.toLocaleString('vi-VN')}đ` : '';
                    document.getElementById('resBtn').href = data.data.aff_link;
                    resultBox.classList.remove('hidden');
                } else {
                    alert('Không thể tạo link cho sản phẩm này.');
                }
            } catch (e) {
                alert('Có lỗi xảy ra, vui lòng thử lại!');
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bolt"></i> CHUYỂN LINK GIẢM GIÁ';
            }
        }
    </script>
</body>
</html>
